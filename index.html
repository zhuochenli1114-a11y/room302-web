["一扇门，把我们带回从前","酒店的走廊像一条没有尽头的时间线。重复的木门、褪色的地毯和远处电视的白噪声，让人想起小时候熟悉却说不清名字的地方。《ROOM 203：白噪梦境》从这种似曾相识的感觉出发，邀请你走进一个介于现实与梦之间的房间，重新看见那些被时间藏起来的细节。","q1"],
["有些记忆，先住在物件里","旧玩具的一块补丁、一只木鸭的轮子、一张折过角的照片，都可能保存着当时的温度。玩家在探索中观察痕迹，把散落的玩具放回它们的位置。这个过程也成为网站的分享入口：你可以选择一件物品的照片，记录它的来处，以及它陪你经历过的某个瞬间。平常的东西，也能承载重要的故事。","q2"],
["沿着线索，找到自己的方向","从走廊到卧室，再到安静的客厅，空间逐渐打开，记忆却未必按顺序出现。颜色、声音与漂浮的气球组成了梦里的提示，玩家通过观察、收集和选择继续前进。项目把成长中的困惑与自我探索放进这些体验里，让每个人按照自己的节奏理解线索，而不是急着给过去一个标准答案。","q3"],
["雪花屏后，是还没说完的话","当电视再次亮起，白噪声中的片段逐渐连成另一种叙述。寻找出口的过程，也可以成为靠近自己的过程。我们希望讨论童年、性别认同与被理解的需要，但不要求每位参与者用同一种方式描述自己。动画放映室将承载这些视觉叙事，让声音、画面和留白一起讲述文字之外的感受。","q4"],

function saveDraft(){if(!current)return false;let drafts=getDrafts(),i=drafts.findIndex(d=>d.id===current.id);current.updated=new Date().toISOString();if(i<0)drafts.unshift(structuredClone(current));else drafts[i]=structuredClone(current);try{setDrafts(drafts);dirty=false;message("存草稿不会投稿，草稿仅在当前页面。要发送给作者，请点击「正式投稿」并确认；关闭或刷新前请复制正文。");return true}catch{message("保存失败：浏览器空间可能不足。可复制正文另行保存。");return false}}
function change(next){if(next===scene&&!modal)return;scene=next;modal=null;render()}
function guarded(next){capture();if(dirty){modal={type:"dirty",next};renderModal()}else change(next)}
function capture(){if(scene==="toy"&&current){for(const k of ["name","appearance","origin","memory"]){let el=document.getElementById("toy-"+k);if(el)current.toy[k]=el.value}current.image=toyPhoto}if(scene==="writer"&&current){current.title=document.getElementById("writer-title")?.value||"";current.html=document.getElementById("editor")?.innerHTML||"";current.format.border=document.getElementById("writer-paper")?.classList.contains("bordered")||false}}

const chapterEnglish=[['A door back to yesterday','The hotel corridor feels like an endless timeline. Repeating wooden doors, faded carpet and distant TV static recall familiar childhood places whose names we cannot quite remember. ROOM 203: White Noise Dreamscape begins with this sense of déjà vu, inviting you into a room between reality and dreams to rediscover details hidden by time.'],['Some memories live in objects first','A patch on an old toy, a wooden duck’s wheel, or a folded photograph can hold the warmth of a moment. Players follow traces and return scattered toys to their places. Here, you can choose a meaningful object and record where it came from and a moment you shared. Ordinary things can carry important stories.'],['Follow clues at your own pace','From corridor to bedroom to quiet living room, spaces open up, but memories need not arrive in order. Colors, sounds and floating balloons offer dreamlike clues. Players observe, collect and choose their way forward. The project places growing pains and self-discovery in these experiences, leaving room for everyone’s own interpretation.'],['Beyond the static, an unfinished story','When the TV lights up again, fragments in the white noise become another narrative. Looking for an exit can also bring us closer to ourselves. We explore childhood, gender identity and the need to be understood without asking everyone to describe themselves the same way. Animation gives voice, image and silence room to tell what words cannot.'],['Leave your memory on this page','Bellevue is the hotel’s patient guide. Begin with a toy or a story, use a pseudonym, skip any question, or take a break. Drafts remain in this session and are not automatically uploaded or published. When you are ready, decide how to continue.']];
Object.assign(translations,{'记忆来信 · ROOM 302':'Memory Letters · ROOM 302','嗨，我是贝利维。无论你是来分享自己的记忆、讲述一段相遇，还是第一次了解跨性别，都欢迎你。先看看、听听，也可以留下一段你愿意分享的故事。':'Hi, I’m Bellevue. Whether you’re here to share your own memories, tell a story about meeting someone, or learn about trans experiences for the first time, you’re welcome here. You can start by looking and listening, or leave a story you feel ready to share.','记忆来信 · ROOM 302 是一个向所有人开放的互动叙事项目。我们通过故事、手绘动画和游戏，认识跨性别者丰富而具体的生活，减少误解与污名。你可以讲述自己的性别探索与成长记忆，也可以分享与跨性别者相识、相处的亲身故事；还可以先阅读、观看与学习，慢慢建立理解。':'Memory Letters · ROOM 302 is an interactive storytelling project open to everyone. Through stories, hand-drawn animation and games, we explore the varied everyday lives of transgender people and challenge misunderstanding and stigma. Share your own memories of gender and growing up, tell a first-hand story of knowing a trans person, or begin by reading, watching and learning.','了解与学习':'Learn and understand','阅读与体验':'Read and explore','分享一段故事':'Share a story','知识小卡片':'Knowledge cards','性别认同是对自身性别的认识。':'Gender identity is a person’s understanding of their own gender.','性别表达是穿着、举止等外在呈现。':'Gender expression is how someone presents themselves outwardly, such as through clothing and mannerisms.','性倾向与性别认同是不同概念。':'Sexual orientation and gender identity are different concepts.','不能只凭外貌判断一个人的性别。':'You cannot determine someone’s gender from their appearance alone.','尊重对方使用的名字和称呼，不追问身体或医疗隐私。':'Respect the name and words someone uses for themselves; do not press them about their body or medical privacy.','每个人经历不同，一个故事不代表整个群体。':'Everyone’s experience is different; one story does not represent an entire community.','我自己的经历':'My own experience','我与跨性别者相处的经历':'My experience of knowing a trans person','暂时只想阅读':'Just here to explore','相处经历的写作提示':'Prompts for a story of knowing someone','你们如何相识？哪个日常瞬间改变了你的理解？有没有误会、学习或支持彼此的经历？有没有一件承载共同记忆的物品？形象和旧物均可选，不必是童年玩具。':'How did you meet? What everyday moment changed your understanding? Was there a misunderstanding, learning, or mutual support? Is there an object that holds a shared memory? A likeness or object is optional; it need not be a childhood toy.','从自己的视角写，不代替对方解释身份；隐去姓名、学校、工作单位等可识别细节。未经允许，不公开他人的性别身份、私密经历或照片。你的授权不等于故事中其他人的同意；公开前需要审核，并按涉及者的同意范围使用。':'Write from your own perspective, not as an interpreter of someone else’s identity. Omit names, schools, workplaces and other identifying details. Never disclose someone’s gender identity, private experiences or photos without permission. Your permission is not consent on behalf of others; any public use would require review and respect for each person’s scope of consent.','返回桌面':'Back to desktop','回到入口':'Back to pathways','可以写成长、自我探索、快乐、被理解的瞬间，或任何你愿意留下的记忆。无需说明自己是否为跨性别者，也不必回答不想回答的问题。':'You can write about growing up, self-discovery, joy, a moment of being understood, or any memory you wish to keep. You do not need to say whether you are transgender or answer anything you would rather skip.'});

Object.assign(translations,{'程序管理器':'Program Manager','菜单栏':'Menu bar','文件':'File','选项':'Options','窗口':'Window','帮助':'Help','写故事':'Write a story','草稿':'Drafts','阅读角':'Reading corner','动画与游戏':'Animation and game','新页':'New page','打开草稿':'Open drafts','插图':'Illustration','花边':'Page border','重做':'Redo','导出':'Export text','导出：复制':'Export: copy','退出':'Exit','字体':'Font','粗体':'Bold','写作工具栏':'Writing toolbar','字数':'Words','本次会话草稿':'Session draft','项目故事':'Project story','图片加载失败，请重新打开页面。':'Image failed to load. Please reopen this page.','温柔的邀请':'A gentle invitation','从故事、游戏和动画开始，按自己的节奏阅读与体验。':'Start with stories, games and animation, and explore at your own pace.','性别认同是对自身性别的认识。性别表达是穿着、举止等外在呈现。性倾向与性别认同是不同概念。不能只凭外貌判断一个人的性别。尊重对方使用的名字和称呼，不追问身体或医疗隐私。每个人经历不同，一个故事不代表整个群体。':'Gender identity is a person’s understanding of their gender. Gender expression includes outward presentation, such as clothing and mannerisms. Sexual orientation is different from gender identity. Appearance alone cannot tell you someone’s gender. Respect the names and terms people use, and do not press them about bodies or medical privacy. Each experience is different; no one story speaks for a whole community.'});

 data-placeholder="${hints.body}">${current?.html||""}</div></div><aside class="writer-side canva-sidebar"><div id="writer-guide" class="writer-guide"><p aria-live="polite"></p><button type="button"></button></div><img id="writing-dog" class="canva-image" src="${A.write}" alt="戴蓝色贝雷帽、拿着笔的贝利维" loading="lazy"><p id="status" class="status canva-text" role="status"></p></aside><div class="writer-foot"><span id="word-count">${tr('字数')}：0</span> · ${tr('本次会话草稿')} · ${tr('当前浏览器的本地草稿 · 不会自动上传或公开')}</div><input id="writer-image-file" type="file" accept="image/*" hidden aria-label="选择插入的图片"></section>`}

function cinemaHTML(){const en=lang==='en';return `<section id="cinema" class="scene cinema canva-section"><div class="topline">${back()}<h1 class="scene-title">${en?'Memory screening room':'记忆放映室'} · ROOM 302</h1></div><div class="curtain"><div class="cinema-screen canva-video" id="cinema-screen"><video id="animation-video" controls playsinline preload="metadata" src="${typeof phoneLayout!=='undefined' && phoneLayout.matches?'assets/video/dream-10-phone.mp4':'assets/video/dream-10-web.mp4'}" aria-label="Dream 10 动画粗稿"></video></div></div>${dog(A.film,"cinema-dog","film-dog","陪伴观影的贝利维")}<div class="cinema-controls"><strong>${en?'Echo of Self · Animation excerpt':'Echo of Self · 动画片段'}</strong><p>${en?'As body hair grows and her reflection becomes an exaggerated bearded figure, the protagonist feels increasingly estranged from her changing body. Shaving, a distorted mirror and the act of tearing into it express her struggle with an imposed image and her search for a self she can recognise.':'腿毛的生长、镜中不断长出胡须并异化的面孔，让主角感到身体变化与内心自我之间的冲突。她试图用剃须刀去除毛发，继而撕开镜面、进入其中。夸张的变形与摇晃的视角，呈现她对被强加形象的抗拒，以及寻找真实自我的过程。'}</p><span class="draft-note">${en?'Rough cut · Backgrounds and some frames are still unfinished':'当前为动画粗稿 · 背景与部分帧尚未完成'}</span></div></section>`}
function storyHTML(){let headings=lang==='en'?['What is this project?','Why collect memories?','How memories become art','What can I share?','A gentle invitation']:['项目是什么','为什么收集','记忆如何进入作品','可以分享什么','温柔的邀请'];let paragraphs=lang==='en'?['Memory Letters · ROOM 302 is an interactive storytelling project open to everyone. Through stories, hand-drawn animation and games, we explore the varied everyday lives of transgender people and challenge misunderstanding and stigma. Share your own memories of gender and growing up, tell a first-hand story of knowing a trans person, or begin by reading, watching and learning.','We collect ordinary moments, including joy, wishes, self-understanding and being understood. No one has to recount pain.','Share a fragment → organize references with permission → translate into hand-drawn animation → old objects trigger memories in the game. Sharing does not guarantee inclusion. Reference use and public display or adaptation require separate permission.','A likeness can be a self-portrait, avatar or written description; a real photo is not needed. A story can be about growing up, identity, joy, being understood or a wish. An old childhood toy is welcome, or another meaningful object: describe its appearance and what it means to you.','Hi, I’m Bellevue. Whether you’re here to share your own memories, tell a story about meeting someone, or learn about trans experiences for the first time, you’re welcome here. You can start by looking and listening, or leave a story you feel ready to share. Your original work is never automatically made public.']:['记忆来信 · ROOM 302 是一个向所有人开放的互动叙事项目。我们通过故事、手绘动画和游戏，认识跨性别者丰富而具体的生活，减少误解与污名。你可以讲述自己的性别探索与成长记忆，也可以分享与跨性别者相识、相处的亲身故事；还可以先阅读、观看与学习，慢慢建立理解。','我们收集成长、自我认同、被理解、快乐和愿望的日常瞬间，不强求讲述痛苦。','分享片段 → 按授权整理参考 → 手绘动画转译 → 旧物触发游戏回忆。分享不保证被作品采用。参考使用与公开展示、改编需要分别授权。','形象可以是自画像、虚拟角色或文字描述，无需真人照。故事可写成长、自我认同、被理解、快乐或愿望的瞬间。旧物优先童年玩具，也可以是其他有意义的物件；请描述外观与意义。','嗨，我是贝利维。无论你是来分享自己的记忆、讲述一段相遇，还是第一次了解跨性别，都欢迎你。先看看、听听，也可以留下一段你愿意分享的故事。原稿不会自动公开。'];let c=chapters[storyPage],illustration=c[2]==='hall'?`<img id="story-final-room" class="lobby-bg canva-image" src="${A.hall}" alt="旅馆客厅" loading="lazy">`:`<div class="crop ${c[2]}" role="img" aria-label="${esc(headings[storyPage])}"></div>`;return `<section id="story" class="scene story canva-section"><div class="topline">${back('desktop')}<h1 class="scene-title">记忆来信 · ROOM 302</h1>${btn(lang==='en'?'Contents':'目录','toc','yellow tiny')}</div><div class="book canva-panel"><div class="page"><div class="story-illustration">${illustration}</div><p class="small">${storyPage+1} / 5</p></div><div class="page"><h2>${headings[storyPage]}</h2><p class="story-copy">${paragraphs[storyPage]}</p>${storyPage===4?`<div class="row">${btn('游戏演示','go:demo','tiny')}${btn('记忆放映室','go:cinema','pink tiny')}${btn('回客厅','go:lobby','yellow tiny')}</div>`:''}</div></div><img id="story-reading-dog" class="story-dog canva-image" src="${A.read}" alt="贝利维阅读项目介绍" loading="lazy"><div class="story-nav">${btn('◀ 上一页','story-prev','tiny')}<strong>${storyPage+1} / 5</strong>${btn('下一页 ▶','story-next','tiny')}</div></section>`}
function helpHTML(){return `<section id="help" class="scene canva-section"><div class="topline">${back("desktop")}<h1 class="scene-title">帮助 · 怎样探索旅馆</h1></div><article class="info-card canva-card"><h2>从哪里开始？</h2><p>从桌面进入大厅。左门是玩具收藏室，右门是故事主题相册；电视播放游戏演示，小沙发通往图文项目介绍，沙发后面的落地灯通往动画放映室。</p><h2>和贝利维交谈</h2><p>点击大厅的大沙发，可以切换贝利维身旁的对话气泡。使用 Tab 也可以依次找到场景入口。</p><h2>写作与隐私</h2><p>首次进入故事收集入口前会显示自愿参与说明。可以跳过、退出或稍后再写；不要填写真实姓名、联系方式等可识别信息。草稿仅在当前会话保留，不会自动提交或公开；请复制正文自行保存。</p><h2>返回与关闭</h2><p>每页的“返回”按钮回到标示的场景；Esc 可以关闭弹窗或返回上一场景。书写时离开会提示处理未保存内容。</p><div class="row info-actions">${btn("进入大厅","go:lobby","yellow")}${btn("阅读项目介绍","go:story","pink")}${btn("回桌面","go:desktop","white")}</div></article></section>`}
function renderModal(){document.querySelector(".modal-scrim")?.remove();if(!modal)return;let content="";
if(modal.type==='reading'){let labels=['项目故事','阅读与体验','了解与学习'];let texts=[intro,'从故事、游戏和动画开始，按自己的节奏阅读与体验。','性别认同是对自身性别的认识。性别表达是穿着、举止等外在呈现。性倾向与性别认同是不同概念。不能只凭外貌判断一个人的性别。尊重对方使用的名字和称呼，不追问身体或医疗隐私。每个人经历不同，一个故事不代表整个群体。'];content=`<h2>📖 ${tr(labels[modal.page])}</h2><div class="reading-tabs">${labels.map((v,i)=>btn('▤ '+tr(v),'reading:'+i,i===modal.page?'yellow tiny':'white tiny')).join('')}</div><p>${tr(texts[modal.page])}</p><div class="row">${btn('项目故事图文册','go:story','tiny')}${btn('游戏演示','go:demo','tiny')}${btn('关闭','modal-close','white tiny')}</div>`}
if(modal.type==="dirty")content=`<h2>这一页还有未保存的内容</h2><p>可以先保存，或直接离开。直接离开不会把这次修改写入本地草稿。</p><div class="row">${btn("保存并离开","dirty-save","yellow")}${btn("不保存并离开","dirty-discard","pink")}${btn("继续编辑","modal-close","white")}</div>`;
if(modal.type==="privacy")content=`<h2>写下故事之前 · 隐私说明</h2><p>参与完全自愿。你可以跳过本次写作、随时退出，也可以只写愿意分享给自己的内容。请勿填写真实姓名、联系方式或其他可识别个人身份的信息。</p><p>草稿不会自动上传。完成写作后，可点击“正式投稿”并确认使用范围，私密发送给项目作者；不会自动公开。关闭页面前请自行复制正文备份。请勿填写真实姓名、住址、学校等可识别细节。</p>${modal.storyKind==='knowing'?`<h2>相处经历的写作提示</h2><p>你们如何相识？哪个日常瞬间改变了你的理解？有没有误会、学习或支持彼此的经历？有没有一件承载共同记忆的物品？形象和旧物均可选，不必是童年玩具。</p><p class="flow-note">从自己的视角写，不代替对方解释身份；隐去姓名、学校、工作单位等可识别细节。未经允许，不公开他人的性别身份、私密经历或照片。你的授权不等于故事中其他人的同意；公开前需要审核，并按涉及者的同意范围使用。</p>`:`<h2>我自己的经历</h2><p>可以写成长、自我探索、快乐、被理解的瞬间，或任何你愿意留下的记忆。无需说明自己是否为跨性别者，也不必回答不想回答的问题。</p>`}<label class="checkline" for="privacy-consent"><input id="privacy-consent" class="canva-input" type="checkbox">我已阅读说明，并自愿在当前浏览器中创建本地草稿。</label><p class="note">下列授权与写作同意相互独立，均为可选项；正式投稿时会再次确认使用范围，不会自动公开。</p><label class="checkline" for="privacy-public"><input id="privacy-public" class="canva-input" type="checkbox">正式投稿时，我会另行决定是否允许将我的片段用于内部参考。</label><label class="checkline" for="privacy-adapt"><input id="privacy-adapt" class="canva-input" type="checkbox">正式投稿时，我会另行决定是否允许公开展示或改编授权。</label><p id="status" class="status" role="status"></p><div class="row">${btn("继续到本地草稿","privacy-continue","yellow")}${btn("跳过收集","privacy-skip","white")}${btn("退出，回到大厅","privacy-exit","pink")}</div>`;
if(modal.type==="options")content=`<h2>选项 · 声音</h2><p>页面操作提示音：${soundOn?"开":"关"}。不影响视频音量。</p>${btn(soundOn?"关闭音效":"开启音效","toggle-sound","yellow")} ${btn("关闭","modal-close","white")}`;
if(modal.type==="alias")content=`<h2>这一页，怎么称呼你？</h2><p>${lang==='en'?'Topic: ':'主题：'}${esc(modal.topicKey!==undefined?topicLabel(modal.topicKey):modal.topic)}${lang==='en'?'. Both fields are optional; avoid identifying details.':'。两项均可跳过，请勿填写真实姓名或可识别信息。'}</p><label class="field" for="alias-name">化名<input id="alias-name" class="canva-input" placeholder="选填"></label><label class="field" for="alias-address">称呼<input id="alias-address" class="canva-input" placeholder="选填"></label><div class="row">${btn("开始写作","alias-start","yellow")}${btn("跳过，直接写","alias-skip")}${btn("再看看主题","modal-close","white")}</div>`;
if(modal.type==="drafts"){let list=getDrafts();content=`<h2>我的草稿</h2><p class="note">仅展示当前浏览器保存的本地玩具记录与故事草稿。</p>${list.length?`<div class="toc-list canva-list">${list.map(d=>`<button type="button" class="topic-choice canva-button" data-act="open-draft" data-id="${esc(d.id)}">${d.kind==="toy"?"🧸 玩具":"✎ 故事"} · ${esc(d.title||d.toy?.name||draftTopic(d)||tr('未命名'))} <span class="small">${esc(draftTopic(d))}</span></button>`).join("")}</div>`:"<p>这里还没有草稿。可以先去玩具收藏室，或选一个故事主题。</p>"}${btn("关闭相册","modal-close","white")}`}
if(modal.type==="new")content=`<h2>新建一页</h2><p>请选择新草稿类型。当前草稿不会被覆盖；若有未保存修改，请先返回保存。</p><div class="row">${btn("新玩具记录","new-toy")}${btn("新故事","new-story","pink")}${btn("取消","modal-close","white")}</div>`;
if(modal.type==="preview")content=`<h2>${esc(current?.title||"未命名的一页")}</h2><p class="small">${esc(draftTopic(current))} · ${current?.kind==="toy"?"玩具故事":"故事"}</p><div style="background:white;border:2px solid #302430;padding:1em;max-height:48vh;overflow:auto;line-height:1.7">${current?.html||"<p>还没有正文。</p>"}</div><p class="note">预览当前编辑内容；尚未保存的修改仍需手动保存。</p>${btn("回到写作","modal-close")}`;
if(modal.type==="toc")content=`<h2>项目故事 · 目录</h2><div class="toc-list canva-list">${chapters.map((c,i)=>`<button type="button" class="topic-choice canva-button" data-act="toc-page" data-page="${i}">${String(i+1).padStart(2,"0")} · ${c[lang==="en"?1:0]}</button>`).join("")}</div>${btn("关闭目录","modal-close","white")}`;
if(scene==='writer' && document.getElementById('writer-guide') && ['preview','dirty'].includes(modal.type) && document.getElementById('editor')?.innerText.trim()){
  const reminder=lang==='en'?'Ready to send? Click Submit, then confirm how the author may use your letter.':'写好了，想寄给作者？点「正式投稿」，确认使用范围后就能寄出。';
  content+=`<p class="note">${reminder}</p>${btn(lang==='en'?'Submit':'正式投稿','writer-finish-submit','pink')}`;
}
stage.insertAdjacentHTML("beforeend",`<div class="modal-scrim"><div class="modal canva-panel" role="dialog" aria-modal="true" aria-label="${modal.type==="privacy"?"隐私说明":"对话框"}">${content}</div></div>`);translatePage();stage.querySelector(".modal button,.modal input")?.focus()}
function setupWriter(){writerGuide();const ed=document.getElementById("editor"),title=document.getElementById("writer-title");const count=()=>{document.getElementById('word-count').textContent=tr('字数')+'：'+ed.innerText.trim().length};count();[ed,title].forEach(el=>el.addEventListener("input",()=>{dirty=true;count();message("有尚未保存的修改")}));ed.addEventListener("mouseup",rememberSelection);ed.addEventListener("keyup",rememberSelection);document.getElementById("writer-image-file").addEventListener("change",e=>loadImage(e.target.files[0],src=>{if(typeof phoneLayout!=='undefined' && phoneLayout.matches){const image=new Image();image.src=src;image.alt=tr('插入的回忆图片');ed.append(image);ed.dispatchEvent(new Event('input'));capture();e.target.value='';return}restoreSelection();ed.focus();document.execCommand("insertHTML",false,`<img src="${src}" alt="${tr('插入的回忆图片')}">`);dirty=true;capture();message("图片已插入，请保存本地草稿")}))}
function rememberSelection(){let s=window.getSelection();if(s?.rangeCount&&document.getElementById("editor")?.contains(s.anchorNode))selectionRange=s.getRangeAt(0).cloneRange()}
function restoreSelection(){let ed=document.getElementById("editor"),s=window.getSelection();ed.focus();if(selectionRange&&ed.contains(selectionRange.commonAncestorContainer)){s.removeAllRanges();s.addRange(selectionRange)}}
function format(cmd,value){restoreSelection();document.execCommand(cmd,false,value);dirty=true;capture();rememberSelection()}
function loadImage(file,done){if(!file)return;if(!file.type.startsWith("image/"))return message("请选择图片文件");let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)}
function setupDemo(){let v=document.getElementById("demo-video");v.addEventListener("error",()=>{document.getElementById("demo-file-name").textContent="现有视频无法播放；请选择本机演示文件。"});v.querySelector("source")?.addEventListener("error",()=>{document.getElementById("demo-file-name").textContent="现有视频无法播放；请选择本机演示文件。"})}
function beep(){if(!soundOn)return;try{let ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=520;g.gain.value=.025;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.07);o.onended=()=>ctx.close()}catch{}}
function enterCollection(dest){if(dest==='writer'||dest==='topic'){shareKind=null;change('share');return}modal={type:"privacy",dest};renderModal()}
stage.addEventListener("click",e=>{let b=e.target.closest("[data-act]");if(!b)return;let act=b.dataset.act;beep();
if(act.startsWith('lang:')){if(scene==='toy'||scene==='writer')capture();let fields={};stage.querySelectorAll('.modal input').forEach(el=>{fields[el.id]={value:el.value,checked:el.checked}});lang=act.slice(5);localStorage.setItem('memory-letters-language',lang);render();Object.entries(fields).forEach(([id,v])=>{let el=document.getElementById(id);if(el){el.value=v.value;el.checked=v.checked}});return}
if(act==='share-own'||act==='share-knowing'){modal={type:'privacy',dest:'topic',storyKind:act==='share-knowing'?'knowing':'own'};renderModal();return}
if(act.startsWith("enter:")){enterCollection(act.slice(6));return}
if(act==='reading'){modal={type:'reading',page:0};renderModal();return}
if(act.startsWith('reading:')){modal.page=Number(act.slice(8));renderModal();return}
if(act==='font'){format('fontName','Noto Sans SC');message('字体');return}
if(act==='redo'){document.getElementById('editor').focus();document.execCommand('redo');dirty=true;capture();return}
if(act==='hotspots'){stage.querySelectorAll('.hotspot').forEach(x=>x.classList.toggle('show-hotspots'));return}
if(act.startsWith("go:")){let dest=act.slice(3);if(scene==="toy"||scene==="writer")guarded(dest);else change(dest);return}
if(act==="modal-close"){modal=null;render();return}
if(act==="dirty-save"){let next=modal.next,open=modal.open;if(saveDraft()){if(open)open();else change(next)}return}
if(act==="dirty-discard"){let next=modal.next,open=modal.open;dirty=false;if(open)open();else change(next);return}
if(act==="privacy-continue"){if(!document.getElementById("privacy-consent").checked){message("请先勾选自愿参与；也可以跳过或退出。");return}let dest=modal.dest;shareKind=modal.storyKind||null;modal=null;if(dest==="toy"){current=newDraft("toy","玩具收藏");toyPhoto="";dirty=false;change("toy")}else if(dest==='writer'){current=newDraft('story','自由写作');dirty=false;change('writer')}else{topicSpread=0;change("topic")}return}
if(act==='writer-finish-submit'){modal=null;renderModal();stage.querySelector('.toolbar [data-act="submit-story"]').click();return}
if(act==="privacy-skip"||act==="privacy-exit"){change("lobby");return}
if(["options","drafts","new","preview","toc"].includes(act)){if(act==="preview"||act==="drafts")capture();modal={type:act};renderModal();return}
if(act==="toggle-sound"){soundOn=!soundOn;renderModal();return}
if(act==="talk"){dialogVisible=true;dialogIndex=(dialogIndex+1)%bubblePages[lang].length;let tip=document.getElementById("lobby-tip");tip.hidden=false;tip.querySelector('.bubble-next').innerHTML=esc(bubbleText())+' <span aria-hidden="true">▸</span>';return}
if(act==="topic-prev"||act==="topic-next"){topicSpread=act==="topic-next"?1:0;render();return}
if(act==='topic-skip'){current=newDraft('story','自由写作');current.storyKind=shareKind||'own';dirty=false;change('writer');return}
if(act==="pick-topic"){modal={type:"alias",topic:b.dataset.topic,topicKey:b.dataset.topicKey===undefined?undefined:Number(b.dataset.topicKey)};renderModal();return}
if(act==="alias-start"||act==="alias-skip"){let d=newDraft("story",modal.topicKey!==undefined?knowingTopics[modal.topicKey].zh:modal.topic);if(modal.topicKey!==undefined)d.topicKey=modal.topicKey;d.storyKind=shareKind||'own';if(act==="alias-start"){d.alias=document.getElementById("alias-name").value;d.address=document.getElementById("alias-address").value}current=d;dirty=false;change("writer");return}
if(act==="save-toy"){capture();saveDraft();return}
if(act==="toy-write"){capture();current.title=current.title||current.toy.name||"我的玩具故事";if(!current.html){current.html=`<p>它叫${esc(current.toy.name||"我的玩具")}。${esc(current.toy.appearance||"")}</p><p>${esc(current.toy.origin||"")}</p><p>${esc(current.toy.memory||"")}</p>`;if(current.image)current.html+=`<img src="${current.image}" alt="${tr('我的玩具照片')}">`}change("writer");dirty=true;message("玩具资料已带入写作页，记得保存。");return}
if(act==="save-writer"){capture();saveDraft();return}
if(act==="insert-image"){document.getElementById("writer-image-file").click();return}
if(act==="border"){document.getElementById("writer-paper").classList.toggle("bordered");dirty=true;capture();return}
if(act==="undo"){document.getElementById("editor").focus();document.execCommand("undo");dirty=true;capture();return}
if(act==="bold")return format("bold");
if(["left","center","right"].includes(act))return format({left:"justifyLeft",center:"justifyCenter",right:"justifyRight"}[act]);
if(act==="copy-text"){capture();let box=document.createElement("textarea");let div=document.createElement("div");div.innerHTML=current.html;box.value=`${current.title}\n${draftTopic(current)}\n\n${div.innerText}`;document.body.append(box);box.select();let ok=document.execCommand("copy");box.remove();message(ok?"正文已复制，可粘贴到其他文档":"复制未成功，请选中正文手动复制。");return}
if(act==="new-toy"){if(dirty){message("请先保存当前修改，再新建草稿。");modal=null;return}enterCollection("toy");return}
if(act==="new-story"){if(dirty){message("请先保存当前修改，再新建草稿。");modal=null;return}modal=null;shareKind=null;change('share');return}
if(act==="open-draft"){let d=getDrafts().find(x=>x.id===b.dataset.id);if(!d)return;const open=()=>{current=structuredClone(d);toyPhoto=current.image||"";dirty=false;change(current.kind==="toy"&&!current.html?"toy":"writer")};if(dirty){capture();modal={type:"dirty",next:"draft",open};renderModal()}else open();return}
if(act==="story-prev"||act==="story-next"){storyPage=Math.max(0,Math.min(chapters.length-1,storyPage+(act==="story-next"?1:-1)));render();return}
if(act==="toc-page"){storyPage=Number(b.dataset.page);modal=null;render();return}
});
stage.addEventListener("change",e=>{if(e.target.id==="toy-file")loadImage(e.target.files[0],src=>{capture();toyPhoto=src;current.image=src;dirty=true;render();message("照片已预览，记得保存。")});
if(e.target.id==="demo-file"&&e.target.files[0]){if(demoURL)URL.revokeObjectURL(demoURL);demoURL=URL.createObjectURL(e.target.files[0]);let v=document.getElementById("demo-video");v.src=demoURL;v.load();document.getElementById("demo-file-name").textContent="已导入："+e.target.files[0].name}
if(e.target.id==="animation-file"&&e.target.files[0]){let name=e.target.files[0].name;if(animationURL)URL.revokeObjectURL(animationURL);animationURL=URL.createObjectURL(e.target.files[0]);document.getElementById("cinema-screen").innerHTML=`<video id="animation-video" controls playsinline src="${animationURL}" aria-label="本机动画影片"></video>`;document.getElementById("animation-name").textContent="已选择："+name}
if(e.target.id==="font-size"){current.format.size=e.target.value;format("fontSize","7");document.getElementById("editor").querySelectorAll('font[size="7"]').forEach(x=>{x.removeAttribute("size");x.style.fontSize=e.target.value+"px"})}
if(e.target.id==="font-color"){current.format.color=e.target.value;format("foreColor",e.target.value)}
});
stage.addEventListener("input",e=>{if(e.target.closest("#toy .page")&&e.target.matches("input,textarea")){dirty=true;message("有尚未保存的修改")}});
document.addEventListener("keydown",e=>{if(e.key!=="Escape"||document.getElementById("submission-dialog")?.open)return;if(modal){if(modal.type==="dirty")return;modal=null;render();return}let target={boot:null,desktop:"boot",lobby:"desktop",toy:"lobby",topic:"lobby",writer:"lobby",demo:"lobby",cinema:"lobby",story:"lobby",help:"desktop"}[scene];if(target){e.preventDefault();if(scene==="toy"||scene==="writer")guarded(target);else change(target)}});
render();
